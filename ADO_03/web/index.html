<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADO 03 · Colisões e Momento</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css">
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 18px; background: #0b0f1a; color: #e6eaf5; font-size: .92rem;
  }
  .topbar a { color: #5b9dff; text-decoration: none; font-weight: 600; }
  .topbar a:hover { text-decoration: underline; }
  #loading { padding: 40px 20px; text-align: center; color: #556; }
  #loading small { display: block; margin-top: 6px; color: #889; }
</style>
</head>
<body>
<div class="topbar">
  <a href="../../index.html">&larr; Voltar ao portfólio</a>
  <span>ADO 03 · Colisões e Momento · roda 100% no seu navegador</span>
  <a href="https://github.com/gustavfreitas/pi_fisica_extensiva/tree/HEAD/ADO_03" target="_blank" rel="noopener">Código-fonte</a>
</div>
<div id="root">
  <div id="loading">
    ⏳ Carregando Python no navegador…
    <small>Na primeira visita pode levar de 10 a 30 segundos. Depois fica em cache.</small>
  </div>
</div>
<script type="module">
  import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
  mount(
    {
      requirements: ["numpy", "matplotlib"],
      entrypoint: "app.py",
      files: { "app.py": { url: "./app.py" } },
      streamlitConfig: { "client.toolbarMode": "viewer" },
    },
    document.getElementById("root"),
  );
</script>
</body>
</html>
